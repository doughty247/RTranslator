[package]
name = "solo-conversation-core"
version = "0.1.0"
edition = "2021"
description = "Solo Conversation mode: per-direction live/push-to-talk speech translation pipeline for RTranslator, callable via UniFFI."
license = "Apache-2.0"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
ort = { version = "2.0.0-rc.10", default-features = false, features = ["ndarray", "std", "load-dynamic", "api-22"] }
ndarray = { version = "0.17", features = ["std"] }
sentencepiece = "0.11"
thiserror = "1.0"
parking_lot = "0.12"
whatlang = "0.18.0"
# Desktop (Linux/Windows/macOS) audio capture for bin/desktop-harness.rs --
# cpal is the standard cross-platform Rust audio I/O crate (ALSA on Linux,
# WASAPI on Windows, CoreAudio on macOS), used only by that binary, not by
# any of the library code Android's UniFFI bindings link against.
cpal = "0.15"
hound = "3.5"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "desktop-harness"
path = "bin/desktop-harness.rs"
