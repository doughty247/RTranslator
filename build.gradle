// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Added for the neural TTS integration (sherpa-onnx's Android API is Kotlin) and the
    // solo-conversation-core UniFFI Kotlin bindings -- this app was pure Java before that.
    // Not verified to build in this environment (no Android SDK/NDK here, see
    // docs/solo-conversation-mode-changelog.md); picked for AGP 8.2.2 / Gradle 8.12
    // compatibility, confirm on a real build.
    ext.kotlin_version = '1.9.22'

    repositories {
        google()
        jcenter()
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.google.com' }

    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.google.com' }
        
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
