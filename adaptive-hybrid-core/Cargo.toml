[package]
name = "adaptive-hybrid-core"
version = "0.1.0"
edition = "2021"
description = "Adaptive Hybrid Mode: per-direction live/push-to-talk speech translation pipeline for RTranslator, callable via UniFFI."
license = "Apache-2.0"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
ort = { version = "2.0.0-rc.10", default-features = false, features = ["ndarray", "std", "load-dynamic", "api-22"] }
ndarray = { version = "0.17", features = ["std"] }
sentencepiece = "0.11"
thiserror = "1.0"
parking_lot = "0.12"
whatlang = "0.18.0"

[dev-dependencies]
hound = "3.5"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
